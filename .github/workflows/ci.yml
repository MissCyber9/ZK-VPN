name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt -e .
      - name: Build ZK circuit (dev setup, single party)
        run: scripts/setup_circuits.sh
      - run: pytest -q
      - name: Shell syntax
        run: bash -n scripts/install.sh scripts/setup_circuits.sh
