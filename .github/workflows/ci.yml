name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"            # Windows runners default to a legacy code page
  PYTHONIOENCODING: utf-8

jobs:
  unit:
    # The portable core (ZK proofs, admission protocol, CLI, configuration, platform layer) on every OS
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.9"}
          - {os: windows-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the repository-hygiene tests read the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt -e .
      - name: Environment report
        run: zkvpn doctor
        continue-on-error: true   # the ZK keys are built in the next step
      - name: Build the ZK keys (development setup, single party)
        run: zkvpn zk setup
      - run: python -m pytest -q
      - name: Shell syntax of the Linux installer
        if: runner.os == 'Linux'
        run: bash -n scripts/install.sh tests/distro/run.sh tests/distro/checks.sh

  e2e:
    # Real network on Linux: namespaces, WireGuard, iptables, real proofs (needs root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update && sudo apt-get install -y wireguard-tools iproute2 iptables
      - run: pip install -r requirements-dev.txt -e .
      - run: zkvpn zk setup
      - name: End-to-end tests in network namespaces
        run: sudo -E env "PATH=$PATH" python -m pytest -m e2e tests/e2e -v

  distro:
    # Installer + real systemd service + real client, per Linux distribution (own network
    # namespace in a privileged container, so the firewall rules never touch the runner).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "fedora:41"]
    steps:
      - uses: actions/checkout@v4
      - name: Installer, service and end-to-end on ${{ matrix.image }}
        run: tests/distro/run.sh ${{ matrix.image }} --e2e

  docker:
    # The published image: no secret inside, server starts with the given key, a client container
    # connects through the tunnel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/docker/smoke.sh

  ceremony:
    name: ceremony (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt -e .
      - run: zkvpn zk setup
      - name: Multi-party ceremony (3 contributors + beacon, tamper tests)
        run: python -m pytest -m slow tests/test_ceremony.py -v

  netsmoke:
    # Real WireGuard interfaces on macOS and Windows: creation, keys, addressing, peers,
    # handshake, parsing, deletion. (Routes/firewall/DNS are not applied to a CI runner.)
    name: netsmoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -e .
      - name: Install WireGuard (macOS)
        if: runner.os == 'macOS'
        run: brew install wireguard-go wireguard-tools
      - name: Install WireGuard (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wireguard -y --no-progress
          "C:\Program Files\WireGuard" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Environment report
        run: zkvpn doctor
        continue-on-error: true
      - name: Real interfaces (macOS, as root)
        if: runner.os == 'macOS'
        run: sudo -E env "PATH=$PATH" python -m pytest -m netsmoke tests/netsmoke -v
      - name: Real interfaces (Windows, elevated)
        if: runner.os == 'Windows'
        run: python -m pytest -m netsmoke tests/netsmoke -v

  secrets:
    # No secret anywhere in the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
