[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = src
markers =
    e2e: real-network tests in Linux namespaces (need root); run with -m e2e
    slow: minutes-long tests (ceremony); run with -m slow
    netsmoke: real WireGuard interfaces on macOS/Windows runners; run with -m netsmoke
addopts = -m "not e2e and not slow and not netsmoke"
